[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "long-tail-revenue-scorer"
version = "1.0.0"
description = "Score keywords by revenue potential using keyword length and intent"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "long", "tail", "revenue", "scorer"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/long-tail-revenue-scorer"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
long-tail-revenue-scorer = "long_tail_revenue_scorer.cli:main"

[tool.setuptools]
packages = ["long_tail_revenue_scorer"]
